<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica Pro</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="assets/css/css.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="calculator-card">
        <!-- Histórico e Visor -->
        <div class="display-container p-3 mb-3">
            <div id="history" class="text-end text-muted small font-monospace overflow-hidden"></div>
            <div id="display" class="text-end display-5 font-monospace fw-bold text-white">0</div>
        </div>

        <!-- Teclado da Calculadora -->
        <div class="calculator-grid">
            <!-- Linha 1: Funções de Memória / Limpeza -->
            <button class="btn btn-func" onclick="clearDisplay()">C</button>
            <button class="btn btn-func" onclick="deleteLast()"><i class="bi bi-backspace"></i></button>
            <button class="btn btn-func" onclick="appendOp('(')">(</button>
            <button class="btn btn-func" onclick="appendOp(')')">)</button>

            <!-- Linha 2: Científica (Trigonometria e Pi) -->
            <button class="btn btn-sci" onclick="appendFunc('sin')">sin</button>
            <button class="btn btn-sci" onclick="appendFunc('cos')">cos</button>
            <button class="btn btn-sci" onclick="appendFunc('tan')">tan</button>
            <button class="btn btn-op" onclick="appendOp('/')">÷</button>

            <!-- Linha 3: Potências e Raízes -->
            <button class="btn btn-sci" onclick="appendFunc('sqrt')">√</button>
            <button class="btn btn-sci" onclick="appendOp('^')">xⁿ</button>
            <button class="btn btn-sci" onclick="appendFunc('log')">log</button>
            <button class="btn btn-op" onclick="appendOp('*')">×</button>

            <!-- Linha 4: Números e Operadores -->
            <button class="btn btn-num" onclick="appendNum('7')">7</button>
            <button class="btn btn-num" onclick="appendNum('8')">8</button>
            <button class="btn btn-num" onclick="appendNum('9')">9</button>
            <button class="btn btn-op" onclick="appendOp('-')">-</button>

            <!-- Linha 5 -->
            <button class="btn btn-num" onclick="appendNum('4')">4</button>
            <button class="btn btn-num" onclick="appendNum('5')">5</button>
            <button class="btn btn-num" onclick="appendNum('6')">6</button>
            <button class="btn btn-op" onclick="appendOp('+')">+</button>

            <!-- Linha 6 -->
            <button class="btn btn-num" onclick="appendNum('1')">1</button>
            <button class="btn btn-num" onclick="appendNum('2')">2</button>
            <button class="btn btn-num" onclick="appendNum('3')">3</button>
            <button class="btn btn-equal row-span-2" onclick="calculate()">=</button>

            <!-- Linha 7 -->
            <button class="btn btn-num" onclick="appendNum('0')">0</button>
            <button class="btn btn-num" onclick="appendNum('.')">,</button>
            <button class="btn btn-sci" onclick="appendNum('π')">π</button>
        </div>
    </div>

    <!-- JavaScript Personalizado -->
    <script src="assets/js/calculo.js"></script>
</body>
</html>
